name: Continuous Integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/alba_ci

      - name: Type check
        run: npm run type-check

      - name: Security audit
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            npm audit --audit-level=high && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "npm audit request failed on attempt $attempt; retrying"
            fi
          done
          exit 1

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production
