name: Deploy to Hostinger

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  # Next.js build settings
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build:
    name: Build Next.js App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Clean build cache
        run: rm -rf .next node_modules/.cache

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Build Next.js app
        run: npm run build
        env:
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Verify build output
        run: |
          echo "=== Checking build output ==="
          ls -la .next/standalone/ || echo "Standalone directory not found"
          ls -la .next/static/ || echo "Static directory not found"
          test -f .next/standalone/server.js && echo "server.js found" || echo "server.js NOT found"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: standalone-build
          path: |
            .next/standalone/
            .next/static/
            public/
            package.json
            prisma/
          retention-days: 1

  deploy:
    name: Deploy to Hostinger
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: standalone-build
          path: ./artifacts

      - name: Deploy to Hostinger (FTP)
        uses: SamKirkland/ftp-deploy@v4.3.3
        with:
          local-dir: ./artifacts
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          server-dir: ${{ secrets.HOSTINGER_DEPLOY_PATH }}

      - name: Verify deployment
        run: |
          echo "Deployment completed for ${{ secrets.HOSTINGER_DEPLOY_PATH }}"

      - name: Post-deployment verification
        if: always()
        run: |
          echo "Deploy path: ${{ secrets.HOSTINGER_DEPLOY_PATH }}"
          echo "Host: ${{ secrets.HOSTINGER_FTP_HOST }}"
          echo "Done"
