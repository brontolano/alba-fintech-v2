name: Deploy to Hostinger

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Validate Hostinger secrets
        env:
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_USERNAME: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          HOSTINGER_DEPLOY_DIR: ${{ secrets.HOSTINGER_DEPLOY_DIR }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
        run: |
          set -e
          missing=0
          for name in HOSTINGER_SSH_HOST HOSTINGER_SSH_USERNAME HOSTINGER_SSH_KEY HOSTINGER_SSH_PORT HOSTINGER_DEPLOY_DIR NEXTAUTH_URL; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Configure the missing secrets in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Clean Next.js build cache
        run: rm -rf .next

      - name: Build Next.js app (standalone output)
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_NAME: ${{ secrets.NEXT_PUBLIC_APP_NAME }}
          NEXT_PUBLIC_CURRENCY: ${{ secrets.NEXT_PUBLIC_CURRENCY }}
          NEXT_PUBLIC_LOCALE: ${{ secrets.NEXT_PUBLIC_LOCALE }}

      - name: Prepare deployment archive
        run: |
          npm run deploy:prepare
          tar -czf alba-fintech-deploy.tar.gz -C deploy-package .

      - name: Clean remote deploy directory
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.HOSTINGER_DEPLOY_DIR }}"
            echo ">>> Cleaning remote deploy directory: $DEPLOY_DIR"
            mkdir -p "$DEPLOY_DIR"
            rm -rf "$DEPLOY_DIR"/.next "$DEPLOY_DIR"/node_modules "$DEPLOY_DIR"/public "$DEPLOY_DIR"/prisma "$DEPLOY_DIR"/server.js

      - name: Upload deployment archive
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          source: "alba-fintech-deploy.tar.gz"
          target: ${{ secrets.HOSTINGER_DEPLOY_DIR }}/

      - name: Restart app
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.HOSTINGER_DEPLOY_DIR }}"

            cd "$DEPLOY_DIR"
            tar -xzf alba-fintech-deploy.tar.gz
            rm -f alba-fintech-deploy.tar.gz
            echo ">>> Restarting Node.js application"
            touch "$DEPLOY_DIR/../restart.txt" && echo "App restarted successfully"

            echo ">>> Deploy complete! App URL: ${{ secrets.NEXTAUTH_URL }}"
