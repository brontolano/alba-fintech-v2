<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Catatan Keuangan Unit dan Transaksi</title>
  <desc id="desc">Infografik perbedaan catatan keuangan unit dan transaksi operasional.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0fdf4"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="150" fill="#bbf7d0" opacity=".45"/>
  <circle cx="80" cy="820" r="180" fill="#bfdbfe" opacity=".35"/>

  <text x="70" y="82" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#15803d" letter-spacing="3">ALBA FINANCE</text>
  <text x="70" y="140" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#0f172a">Catatan Keuangan Unit</text>
  <text x="70" y="180" font-family="Arial, sans-serif" font-size="21" fill="#475569">Memahami perbedaan catatan keuangan dan transaksi operasional</text>

  <g filter="url(#shadow)">
    <rect x="70" y="230" width="500" height="405" rx="24" fill="#ffffff"/>
    <rect x="630" y="230" width="500" height="405" rx="24" fill="#ffffff"/>
  </g>

  <rect x="70" y="230" width="500" height="96" rx="24" fill="#047857"/>
  <rect x="630" y="230" width="500" height="96" rx="24" fill="#1d4ed8"/>

  <circle cx="125" cy="278" r="28" fill="#d1fae5"/>
  <path d="M113 278h24M125 266v24M116 290h18" stroke="#047857" stroke-width="5" stroke-linecap="round"/>
  <text x="170" y="273" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">Catatan Keuangan</text>
  <text x="170" y="301" font-family="Arial, sans-serif" font-size="17" fill="#d1fae5">Dokumentasi dan rekonsiliasi</text>

  <circle cx="685" cy="278" r="28" fill="#dbeafe"/>
  <path d="M674 275h22M674 284h22M679 266v24" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
  <text x="730" y="273" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">Transaksi</text>
  <text x="730" y="301" font-family="Arial, sans-serif" font-size="17" fill="#dbeafe">Aliran uang yang terjadi</text>

  <text x="105" y="375" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Digunakan untuk:</text>
  <g font-family="Arial, sans-serif" font-size="18" fill="#334155">
    <circle cx="115" cy="415" r="5" fill="#10b981"/><text x="135" y="421">Rekap kas dan kondisi keuangan unit</text>
    <circle cx="115" cy="458" r="5" fill="#10b981"/><text x="135" y="464">Keterangan tambahan dari Manager</text>
    <circle cx="115" cy="501" r="5" fill="#10b981"/><text x="135" y="507">Catatan biaya operasional</text>
    <circle cx="115" cy="544" r="5" fill="#10b981"/><text x="135" y="550">Penanda sudah atau belum direkonsiliasi</text>
  </g>
  <rect x="105" y="577" width="430" height="34" rx="17" fill="#ecfdf5"/>
  <text x="320" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#047857">Fokus: menjelaskan dan memeriksa</text>

  <text x="665" y="375" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Contoh rutin unit:</text>
  <g font-family="Arial, sans-serif" font-size="18" fill="#334155">
    <circle cx="675" cy="415" r="5" fill="#3b82f6"/><text x="695" y="421">Penjualan barang atau makanan</text>
    <circle cx="675" cy="458" r="5" fill="#3b82f6"/><text x="695" y="464">Pembelian stok dan bahan baku</text>
    <circle cx="675" cy="501" r="5" fill="#3b82f6"/><text x="695" y="507">Listrik, air, gaji, dan operasional</text>
    <circle cx="675" cy="544" r="5" fill="#3b82f6"/><text x="695" y="550">Penerimaan administrasi atau tabungan</text>
  </g>
  <rect x="665" y="577" width="430" height="34" rx="17" fill="#eff6ff"/>
  <text x="880" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">Fokus: mencatat aliran uang</text>

  <path d="M600 270v335" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 10"/>

  <g filter="url(#shadow)">
    <rect x="70" y="690" width="1060" height="135" rx="24" fill="#0f172a"/>
  </g>
  <text x="105" y="736" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Ringkasnya</text>
  <text x="105" y="775" font-family="Arial, sans-serif" font-size="20" fill="#cbd5e1">Transaksi mencatat kejadian uangnya.</text>
  <text x="650" y="775" font-family="Arial, sans-serif" font-size="20" fill="#cbd5e1">Catatan keuangan membantu menjelaskan dan memeriksanya.</text>
  <text x="105" y="808" font-family="Arial, sans-serif" font-size="15" fill="#94a3b8">ALBA Finance | Sistem Manajemen Keuangan Pondok Pesantren Al-Basyariyah</text>
</svg>
