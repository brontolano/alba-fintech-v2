<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline - ALBA Finance</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #059669;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .card {
        text-align: center;
        padding: 24px;
      }
      img {
        width: 96px;
        height: 96px;
        border-radius: 20px;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        opacity: 0.92;
        margin: 0 0 20px;
      }
      button {
        background: #fff;
        color: #065f46;
        border: 0;
        padding: 10px 18px;
        border-radius: 8px;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon-192.png" alt="ALBA Finance" />
      <h1>Koneksi Terputus</h1>
      <p>Kamu sedang offline. Periksa koneksi internet untuk melanjutkan.</p>
      <button onclick="location.reload()">Coba Lagi</button>
    </div>
  </body>
</html>
