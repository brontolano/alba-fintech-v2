<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALBA Finance - Offline</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.1/dist/tailwind.min.css" />
</head>
<body class="bg-slate-50">
  <div class="min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full bg-white rounded-xl shadow-lg border border-slate-200 p-8 text-center">
      <div class="w-16 h-16 rounded-lg flex items-center justify-center mx-auto mb-6">
        <img src="/logo-baru.png" alt="ALBA Finance" class="h-16 w-auto object-contain" />
      </div>
      <h1 class="text-2xl font-bold text-slate-900 mb-2">Mode Offline</h1>
      <p class="text-slate-500 mb-4">
        Anda sedang berada dalam mode offline. Silakan cek koneksi internet Anda
        dan coba lagi.
      </p>
      <button 
        onclick="window.location.reload()" 
        class="px-4 py-2 bg-brand-600 text-white rounded-lg hover:bg-brand-700 transition"
      >
        Coba Lagi
      </button>
    </div>
  </div>
</body>
</html>
