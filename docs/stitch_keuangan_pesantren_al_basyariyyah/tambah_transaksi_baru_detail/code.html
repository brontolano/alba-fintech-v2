<input class="form-input-soft pl-10" id="tanggal" name="tanggal" required="" type="date">
</div>
</div>
<!-- Pilih Unit -->
<div>

<div class="relative">
<span class="material-symbols-outlined absolute left-space-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">domain</span>
<select class="form-input-soft pl-10 appearance-none bg-no-repeat bg-[url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%2343474e%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E')] bg-[position:right_12px_center] bg-[length:20px_20px]" id="unit" name="unit">
<option disabled="" selected="" value="">Pilih unit terkait</option>
<option value="kantor">Kantor Pusat</option>
<option value="kantin">Kantin Sekolah</option>
<option value="koperasi">Koperasi</option>
</select>
</div>
</div>
<!-- Jenis Transaksi (Radio Cards) -->

<script>
        // Auto-format nominal currency input
        const nominalInput = document.getElementById('nominal');
        nominalInput.addEventListener('input', function (e) {
            let value = e.target.value.replace(/[^,\d]/g, '').toString();
            let split = value.split(',');
            let sisa = split[0].length % 3;
            let rupiah = split[0].substr(0, sisa);
            let ribuan = split[0].substr(sisa).match(/\d{3}/gi);

            if (ribuan) {
                let separator = sisa ? '.' : '';
                rupiah += separator + ribuan.join('.');
            }

            rupiah = split[1] != undefined ? rupiah + ',' + split[1] : rupiah;
            e.target.value = rupiah;
        });
    </script>
