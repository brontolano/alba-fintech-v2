        return transactions.filter(t => t.type === 'debit').reduce((acc, curr) => acc + curr.amount, 0);
      }, [transactions]);

      const totalKredit = useMemo(() => {
        return transactions.filter(t => t.type === 'kredit').reduce((acc, curr) => acc + curr.amount, 0);
      }, [transactions]);

      const initialSaldo = -3483843600;
      const currentSaldo = initialSaldo + totalDebit - totalKredit;

        return transactions.filter(t => {
          const matchesSearch = t.description.toLowerCase().includes(searchTerm.toLowerCase()) || t.date.includes(searchTerm);
          const matchesType = filterType === 'all' ? true : t.type === filterType;
          return matchesSearch && matchesType;
        }).reverse();
      }, [transactions, searchTerm, filterType]);

        return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num);

          type: newType,

          )}

          <header className="bg-emerald-700 text-white pt-6 pb-8 px-4 rounded-b-3xl shadow-md">
            <div className="flex justify-between items-center mb-4">
              <div>
                <span className="text-xs uppercase tracking-wider bg-emerald-600 px-2.5 py-1 rounded-full font-semibold">Keuangan Pesantren</span>
                <h1 className="text-xl font-bold mt-1">Buku Kas & Saldo Bulanan</h1>
              </div>
              <div className="w-10 h-10 rounded-full bg-emerald-600 flex items-center justify-center border-2 border-emerald-500 shadow-inner">
                <i data-lucide="book-open" className="w-5 h-5 text-emerald-100"></i>
              </div>
            </div>

            <div className="bg-emerald-800/80 backdrop-blur-md rounded-2xl p-4 border border-emerald-600 shadow-inner mt-2">
              <p className="text-xs text-emerald-200 font-medium">Sisa Saldo Akhir Terkini</p>
              <h2 className="text-2xl font-black mt-1 text-rose-300">{formatIDR(currentSaldo)}</h2>
              <div className="grid grid-cols-2 gap-2 mt-3 pt-3 border-t border-emerald-700/60">
                <div className="flex items-center space-x-2">
                  <div className="p-1.5 bg-emerald-700 rounded-lg">
                    <i data-lucide="arrow-down-right" className="w-4 h-4 text-emerald-300"></i>
                  </div>
                  <div>
                    <p className="text-[10px] text-emerald-200">Total Masuk</p>
                    <p className="text-xs font-bold text-white">{formatIDR(totalDebit)}</p>
                  </div>
                </div>
                <div className="flex items-center space-x-2">
                  <div className="p-1.5 bg-emerald-700 rounded-lg">
                    <i data-lucide="arrow-up-right" className="w-4 h-4 text-amber-300"></i>
                  </div>
                  <div>
                    <p className="text-[10px] text-emerald-200">Total Keluar</p>
                    <p className="text-xs font-bold text-white">{formatIDR(totalKredit)}</p>
                  </div>
                </div>
              </div>
            </div>
          </header>

          <main className="px-4 mt-6">
            {activeTab === 'dashboard' && (
              <div className="space-y-6">
                <div className="flex justify-between items-center">
                  <h3 className="text-sm font-bold text-slate-700 uppercase tracking-wide">Ringkasan Periode</h3>
                  <button 
                    onClick={() => setModalOpen(true)}
                    className="flex items-center space-x-1 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-3 py-2 rounded-xl shadow-sm transition"
                  >
                    <i data-lucide="plus-circle" className="w-4 h-4"></i>
                    <span>Catat Transaksi</span>
                  </button>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-between">
                    <div className="flex items-center justify-between text-emerald-600 mb-2">
                      <span className="text-xs font-semibold">Pemasukan / Masuk</span>
                      <i data-lucide="trending-up" className="w-4 h-4"></i>
                    </div>
                    <p className="text-xs font-bold text-slate-800">{formatIDR(totalDebit)}</p>
                    <span className="text-[10px] text-slate-400 mt-1">Termasuk Kembalian Pasar</span>
                  </div>
                  <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-between">
                    <div className="flex items-center justify-between text-rose-600 mb-2">
                      <span className="text-xs font-semibold">Pengeluaran / Keluar</span>
                      <i data-lucide="trending-down" className="w-4 h-4"></i>
                    </div>
                    <p className="text-xs font-bold text-slate-800">{formatIDR(totalKredit)}</p>
                    <span className="text-[10px] text-slate-400 mt-1">Gaji Mang, Konsumsi, dll</span>
                  </div>
                </div>

                <div className="bg-emerald-900 text-emerald-100 p-4 rounded-2xl flex items-center justify-between shadow-md">
                  <div>
                    <p className="text-xs text-emerald-300 font-medium">Buku Kas Periode</p>
                    <h4 className="text-sm font-bold text-white">Juni - Agustus 2026</h4>
                    <p className="text-[10px] text-emerald-200 mt-0.5">Saldo Akhir Akurat: -Rp 2.544.488.100</p>
                  </div>
                  <button 
                    onClick={() => setActiveTab('transactions')}
                    className="bg-emerald-700 hover:bg-emerald-600 text-white text-xs px-3 py-2 rounded-xl transition font-medium"
                  >
                    Lihat Buku
                  </button>
                </div>
              </div>
            )}

            {activeTab === 'transactions' && (
              <div className="space-y-4">
                <div className="flex space-x-2">
                  <div className="relative flex-1">
                    <i data-lucide="search" className="absolute left-3 top-2.5 w-4 h-4 text-slate-400"></i>
                    <input 
                      type="text" 
                      placeholder="Cari keterangan atau tanggal..."
                      value={searchTerm}
                      onChange={(e) => setSearchTerm(e.target.value)}
                      className="w-full pl-9 pr-4 py-2 bg-white border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500"
                    />
                  </div>
                  <select 
                    value={filterType} 
                    onChange={(e) => setFilterType(e.target.value)}
                    className="bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500 font-medium text-slate-600"
                  >
                    <option value="all">Semua</option>
                    <option value="debit">Debit (+)</option>
                    <option value="kredit">Kredit (-)</option>
                  </select>
                </div>

                <div className="space-y-2.5">
                  {filteredTransactions.length === 0 ? (
                    <div className="text-center py-12 bg-white rounded-2xl border border-slate-100">
                      <i data-lucide="file-text" className="w-10 h-10 text-slate-300 mx-auto mb-2"></i>
                      <p className="text-xs text-slate-500">Tidak ada transaksi yang ditemukan.</p>
                    </div>
                  ) : (
                    filteredTransactions.map((t) => (
                      <div key={t.id} className="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                        <div className="flex items-center space-x-3">
                          <div className={`w-9 h-9 rounded-xl flex items-center justify-center font-bold text-xs ${t.type === 'saldo' ? 'bg-amber-50 text-amber-600' : t.type === 'debit' ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600'}`}>
                            {t.type === 'saldo' ? 'MIN' : t.type === 'debit' ? 'IN' : 'OUT'}
                          </div>
                          <div>
                            <p className="text-xs font-bold text-slate-800 line-clamp-1">{t.description}</p>
                            <p className="text-[10px] text-slate-400 mt-0.5 flex items-center space-x-1">
                              <i data-lucide="calendar" className="w-3 h-3"></i>
                              <span>{t.date}</span>
                            </p>
                          </div>
                        </div>
                        <div className="text-right">
                          <p className={`text-xs font-black ${t.type === 'saldo' ? 'text-amber-600' : t.type === 'debit' ? 'text-emerald-600' : 'text-rose-600'}`}>
                            {t.type === 'saldo' ? '- ' : t.type === 'debit' ? '+ ' : '- '}{formatIDR(t.amount)}
                          </p>
                          <span className="text-[9px] uppercase tracking-wider text-slate-400 font-semibold">{t.type}</span>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            )}

            {activeTab === 'summary' && (
              <div className="space-y-4">
                <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                  <h3 className="text-xs font-bold text-slate-700 uppercase tracking-wide">Laporan Keuangan Singkat</h3>
                  <div className="space-y-3 pt-2">
                    <div className="flex justify-between items-center pb-2 border-b border-slate-100">
                      <span className="text-xs text-slate-500">Saldo Awal Pindahan</span>
                      <span className="text-xs font-bold text-rose-600">- {formatIDR(3483843600)}</span>
                    </div>
                    <div className="flex justify-between items-center pb-2 border-b border-slate-100">
                      <span className="text-xs text-slate-500">Total Pemasukan / Debit</span>
                      <span className="text-xs font-bold text-emerald-600">+ {formatIDR(totalDebit)}</span>
                    </div>
                    <div className="flex justify-between items-center pb-2 border-b border-slate-100">
                      <span className="text-xs text-slate-500">Total Pengeluaran / Kredit</span>
                      <span className="text-xs font-bold text-rose-600">- {formatIDR(totalKredit)}</span>
                    </div>
                    <div className="flex justify-between items-center pt-1">
                      <span className="text-xs font-bold text-slate-700">Saldo Akhir</span>
                      <span className="text-sm font-black text-rose-600">{formatIDR(currentSaldo)}</span>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </main>

          {modalOpen && (
            <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl">
                <h3 className="text-sm font-bold text-slate-800 mb-4">Tambah Catatan Keuangan</h3>
                <form onSubmit={handleAddTransaction} className="space-y-3">
                  <div>
                    <label className="text-[10px] font-bold text-slate-500 uppercase">Tanggal</label>
                    <input 
                      type="date" 
                      value={newDate} 
                      onChange={(e) => setNewDate(e.target.value)}
                      className="w-full mt-1 p-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500"
                    />
                  </div>
                  <div>
                    <label className="text-[10px] font-bold text-slate-500 uppercase">Keterangan</label>
                    <input 
                      type="text" 
                      placeholder="Contoh: HER Agustus (Tf)"
                      value={newDesc} 
                      onChange={(e) => setNewDesc(e.target.value)}
                      className="w-full mt-1 p-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-[10px] font-bold text-slate-500 uppercase">Jenis</label>
                      <select 
                        value={newType} 
                        onChange={(e) => setNewType(e.target.value)}
                        className="w-full mt-1 p-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500"
                      >
                        <option value="debit">Debit (+)</option>
                        <option value="kredit">Kredit (-)</option>
                      </select>
                    </div>
                    <div>
                      <label className="text-[10px] font-bold text-slate-500 uppercase">Nominal (Rp)</label>
                      <input 
                        type="number" 
                        placeholder="1000000"
                        value={newAmount} 
                        onChange={(e) => setNewAmount(e.target.value)}
                        className="w-full mt-1 p-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500"
                      />
                    </div>
                  </div>
                  <div className="flex space-x-2 pt-2">
                    <button 
                      type="button" 
                      onClick={() => setModalOpen(false)}
                      className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-semibold py-2.5 rounded-xl transition"
                    >
                      Batal
                    </button>
                    <button 
                      type="submit" 
                      className="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold py-2.5 rounded-xl shadow-sm transition"
                    >
                      Simpan
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-slate-100 px-6 py-3 flex justify-between items-center z-40 shadow-lg">
            <button 
              onClick={() => setActiveTab('dashboard')}
              className={`flex flex-col items-center space-y-1 ${activeTab === 'dashboard' ? 'text-emerald-600' : 'text-slate-400'}`}
            >
              <i data-lucide="wallet" className="w-5 h-5"></i>
              <span className="text-[10px] font-semibold">Beranda</span>
            </button>
            <button 
              onClick={() => setActiveTab('transactions')}
              className={`flex flex-col items-center space-y-1 ${activeTab === 'transactions' ? 'text-emerald-600' : 'text-slate-400'}`}
            >
              <i data-lucide="book-open" className="w-5 h-5"></i>
              <span className="text-[10px] font-semibold">Buku Kas</span>
            </button>
            <button 
              onClick={() => setActiveTab('summary')}
              className={`flex flex-col items-center space-y-1 ${activeTab === 'summary' ? 'text-emerald-600' : 'text-slate-400'}`}
            >
              <i data-lucide="pie-chart" className="w-5 h-5"></i>
              <span className="text-[10px] font-semibold">Laporan</span>
            </button>
          </nav>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
    setTimeout(() => lucide.createIcons(), 100);
  </script>
</body>
</html>
