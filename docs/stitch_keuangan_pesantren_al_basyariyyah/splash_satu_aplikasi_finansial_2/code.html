<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(2, 36, 72, 0.05);
        }
        .pagination-dot {
            transition: all 0.3s ease;
        }
        .pagination-dot.active {
            width: 24px;
            background-color: theme('colors.primary');
        }
        .fade-in-up {
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen font-body antialiased selection:bg-primary-container selection:text-on-primary-container flex flex-col items-center justify-center relative overflow-hidden">
<!-- Ambient Background Elements -->
<div class="absolute inset-0 overflow-hidden pointer-events-none z-0">
<div class="absolute top-[-10%] right-[-10%] w-[50%] h-[50%] rounded-full bg-primary-fixed opacity-30 blur-3xl mix-blend-multiply"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[60%] h-[60%] rounded-full bg-secondary-fixed opacity-20 blur-3xl mix-blend-multiply"></div>
</div>
<!-- Main Container -->
<main class="w-full max-w-[428px] h-[100dvh] md:h-[85vh] md:max-h-[850px] bg-surface flex flex-col justify-between relative z-10 shadow-2xl md:rounded-[40px] overflow-hidden border-x md:border border-outline-variant/30 mx-auto">
<!-- Header / Logo Area -->

<!-- Illustration Canvas -->
<div class="flex-1 w-full relative flex items-center justify-center p-gutter mt-space-4 fade-in-up delay-1">
<div class="relative w-full aspect-square max-w-[320px] mx-auto">
<img alt="Ilustrasi ponsel dengan grafik pertumbuhan dan transaksi finansial" class="w-full h-full object-contain drop-shadow-xl animate-[float_6s_ease-in-out_infinite]" src="https://lh3.googleusercontent.com/aida/AP1WRLtMtEy_dAxbMur_ppiueAJfBHeTjnK7QD8JwV-jWQP2wlkQvx0_rPMM8wImkMjI6U3W3e8oGVn19cYXSrSo1gEAOGjn3Vdp2mUCnyeKtD7l2-QrLb01ay0Pz0eS6gVMkJPml-dxHlLhIm8nCo5MwuxbybY76I4OGfKX_YckkDrju5WRzRwRUslnRcXPdCDiLfBo7FZKk9fH8sEHhqaoE5UJw7s6cgWYM3bslPeCUF1ast5Q-4Tg1rt4LA0" style="animation-duration: 6s; animation-timing-function: ease-in-out; animation-iteration-count: infinite; animation-direction: normal; animation-fill-mode: none; animation-play-state: running; animation-name: float; animation-timeline: auto; animation-range: normal;">
</div>
</div>
<!-- Content Area -->
<div class="w-full px-gutter pb-space-8 pt-space-4 bg-gradient-to-t from-surface via-surface to-transparent flex flex-col items-center text-center fade-in-up delay-2 z-20">
<h1 class="font-h2 text-h2 text-primary mb-space-3 max-w-[300px]">
                Masa Depan Pesantren</h1>
<p class="font-body text-body text-on-surface-variant mb-space-6 max-w-[320px]">
                Mengelola keuangan dan transaksi pondok tidak lagi melelahkan</p>
<!-- Pagination Dots -->
<div class="flex items-center justify-center gap-2 mb-space-6">
<div class="h-2 w-2 rounded-full bg-outline-variant pagination-dot"></div>
<div class="h-2 w-2 rounded-full bg-outline-variant pagination-dot"></div>
<div class="h-2 w-2 rounded-full bg-primary pagination-dot active"></div>
</div>
<!-- Action Button -->
<button class="w-full bg-primary hover:bg-primary/90 text-on-primary font-h3 text-body py-4 rounded-full transition-all duration-300 shadow-md hover:shadow-lg active:scale-[0.98] flex justify-center items-center gap-2 fade-in-up delay-3 group">Masuk Sekarang<span class="material-symbols-outlined text-[20px] transition-transform group-hover:translate-x-1" style="font-variation-settings: &quot;FILL&quot; 0;">arrow_forward</span>
</button>
</div>
</main>
<style>
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
    </style>
