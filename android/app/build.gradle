plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization' version '1.9.24'
}

android {
    namespace 'com.brontolano.albafintech'
    compileSdk 34

    defaultConfig {
        applicationId "com.brontolano.albafintech"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        manifestPlaceholders = [
            NEXTAUTH_URL: "https://alba.brontolano.com",
            API_BASE_URL: "https://alba.brontolano.com"
        ]

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.6.10'
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    packagingOptions {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
    }
}

dependencies {
    // Core
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.2'
    implementation 'androidx.activity:activity-compose:1.9.0'

    // Compose
    implementation "androidx.compose.ui:ui:1.6.10"
    implementation "androidx.compose.ui:ui-graphics:1.6.10"
    implementation "androidx.compose.ui:ui-tooling-preview:1.6.10"
    implementation "androidx.compose.material3:material3:1.2.1"
    debugImplementation "androidx.compose.ui:ui-tooling:1.6.10"

    // Navigation
    implementation "androidx.navigation:navigation-compose:2.7.7"

    // Retrofit + Kotlin Serialization
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-kotlinx-serialization:1.1.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Coil for image loading
    implementation 'io.coil-kt:coil-compose:2.6.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4:1.6.10'
}
